[project]
name = "gaokao-audit"
version = "0.1.0"
description = "高考志愿方案审计器 —— 只审计，不生成"
requires-python = ">=3.12"
dependencies = ["pandas"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
